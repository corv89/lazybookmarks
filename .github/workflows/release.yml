name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: macos
            arch: x86_64
            runner: macos-13
          - os: macos
            arch: arm64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Build
        run: nimble release

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/lazybookmarks-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C build lazybookmarks
          ( cd dist && shasum -a 256 "lazybookmarks-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" > "lazybookmarks-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: lazybookmarks-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: ( cd dist && cat *.sha256 > SHA256SUMS )

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
